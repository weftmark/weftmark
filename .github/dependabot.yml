# Dependabot configuration: keeps pip, npm, Docker and GitHub Actions dependencies fresh.
#
# All ecosystems use weekly grouped updates to keep PR volume low.
# PRs target dev and run through ci-dev-pr.yml (full test suite).
#
# Commit prefixes drive release-please (release-please-config.json):
#   fix(deps)     runtime deps that ship in the images (backend pip, frontend npm,
#                 Dockerfile base images). release-please counts these as
#                 user-facing and opens or updates a release PR on main.
#   chore(deps*)  build/test-only deps (dev deps, Actions, e2e, compose services).
#                 These never trigger a release on their own.
# If runtime-dep PRs still say chore(deps), GitHub is on a stale copy of this file:
# check commit-message-options in the "Dependabot Updates" run log.
#
# Auto-merge is intentionally not configured; review manually.

version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Denver
    open-pull-requests-limit: 5
    target-branch: dev
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - dependencies
      - backend
    groups:
      backend-deps:
        patterns:
          - "*"
    assignees:
      - gx1400

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Denver
    open-pull-requests-limit: 5
    target-branch: dev
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - dependencies
      - frontend
    groups:
      frontend-deps:
        patterns:
          - "*"
    assignees:
      - gx1400

  # Playwright end-to-end suite: test tooling only, never shipped.
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Denver
    open-pull-requests-limit: 2
    target-branch: dev
    commit-message:
      prefix: "chore(deps-dev)"
    labels:
      - dependencies
    groups:
      e2e-deps:
        patterns:
          - "*"
    assignees:
      - gx1400

  # Base images the published containers ship on.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /errors
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Denver
    open-pull-requests-limit: 5
    target-branch: dev
    commit-message:
      prefix: "fix(deps)"
    labels:
      - dependencies
      - infra
    groups:
      docker-base-images:
        patterns:
          - "*"
    assignees:
      - gx1400

  # Service images in the compose files (postgres, redis). The deployed stacks are
  # defined in Komodo, so these files are reference/dev copies; hence chore.
  # Postgres majors need a dump/restore, so they are upgraded by hand.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Denver
    open-pull-requests-limit: 2
    target-branch: dev
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - infra
    groups:
      compose-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    assignees:
      - gx1400

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Denver
    open-pull-requests-limit: 5
    target-branch: dev
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - ci/cd
    groups:
      actions:
        patterns:
          - "*"
    assignees:
      - gx1400
