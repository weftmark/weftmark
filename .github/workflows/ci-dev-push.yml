name: Dev push

# Post-merge bookkeeping for pushes to dev.
# Tests already passed on the PR — this workflow only does SBOM updates.
# No validation jobs run here.
#
# Versioning is NOT done here: release-please owns VERSION, frontend/package.json
# and CHANGELOG.md via its release PR on main (see ci-main-push.yml). The release
# commit comes back to dev through the main → dev sync PR.
#
# sbom-backend and sbom-frontend run in parallel — they write to separate
# files so git pull --rebase handles ordering without conflicts.
#
# All jobs are skipped when weftmark-bot[bot] pushes (SBOM commits
# would otherwise re-trigger this workflow infinitely).
# Note: do NOT put ci-skip tokens in bot commit messages; they propagate
# into merge commit bodies and suppress PR workflows on the target branch.
#
# On scheduled runs (weekly Monday 03:00 UTC) both SBOMs are regenerated
# unconditionally regardless of whether package files changed. This ensures
# the backend SBOM stays current even when requirements.txt is unchanged for
# extended periods (backend packages change less often than frontend npm deps).
#
# A full SonarCloud re-scan of the dev branch is a separate, manually
# triggered workflow — see sonarcloud-full-scan.yml — rather than running
# on every push here.
#
# Required secrets:
#   WEFTMARK_BOT_CLIENT_ID   — GitHub App client ID
#   WEFTMARK_BOT_PRIVATE_KEY — GitHub App private key

on:
  push:
    branches: [dev]
  schedule:
    - cron: "0 3 * * 1"  # Mondays 03:00 UTC

concurrency:
  group: dev-push-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  sbom-backend:
    name: SBOM backend (CycloneDX + pip-licenses)
    runs-on: ubuntu-latest
    if: github.actor != 'weftmark-bot[bot]'
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.WEFTMARK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.WEFTMARK_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Detect backend package changes
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            git diff --name-only HEAD~1 HEAD | grep -q "^backend/requirements" \
              && echo "changed=true" >> $GITHUB_OUTPUT \
              || echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - if: steps.detect.outputs.changed == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate backend SBOM and license manifest
        if: steps.detect.outputs.changed == 'true'
        run: |
          pip install cyclonedx-bom pip-licenses
          pip install -r backend/requirements.txt
          mkdir -p sbom
          cyclonedx-py requirements backend/requirements.txt \
            --output-format JSON --output-file sbom/sbom-backend.json
          pip-licenses --format=json --output-file sbom/licenses-backend.json

      - name: Commit if changed
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name  "weftmark-bot[bot]"
          git config user.email "weftmark-bot[bot]@users.noreply.github.com"
          git add sbom/sbom-backend.json sbom/licenses-backend.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update backend SBOM and license manifest"
            git pull --rebase origin dev
            git push origin dev
          fi

      - uses: actions/upload-artifact@v7
        if: steps.detect.outputs.changed == 'true'
        with:
          name: sbom-backend-${{ github.sha }}
          path: sbom/sbom-backend.json
          retention-days: 90

  sbom-frontend:
    name: SBOM frontend (CycloneDX + license-checker)
    runs-on: ubuntu-latest
    if: github.actor != 'weftmark-bot[bot]'
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.WEFTMARK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.WEFTMARK_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Detect frontend package changes
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            git diff --name-only HEAD~1 HEAD | grep -qE "^frontend/package(-lock)?\.json" \
              && echo "changed=true" >> $GITHUB_OUTPUT \
              || echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - if: steps.detect.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Generate frontend SBOM and license manifest
        if: steps.detect.outputs.changed == 'true'
        run: |
          cd frontend && npm ci
          mkdir -p ../sbom
          npx @cyclonedx/cyclonedx-npm \
            --output-format JSON --output-file ../sbom/sbom-frontend.json
          npx license-checker --json --out ../sbom/licenses-frontend.json

      - name: Commit if changed
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name  "weftmark-bot[bot]"
          git config user.email "weftmark-bot[bot]@users.noreply.github.com"
          git add sbom/sbom-frontend.json sbom/licenses-frontend.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update frontend SBOM and license manifest"
            git pull --rebase origin dev
            git push origin dev
          fi

      - uses: actions/upload-artifact@v7
        if: steps.detect.outputs.changed == 'true'
        with:
          name: sbom-frontend-${{ github.sha }}
          path: sbom/sbom-frontend.json
          retention-days: 90
