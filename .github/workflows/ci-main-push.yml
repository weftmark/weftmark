name: Main push

# ============================================================
# NO FILE WRITES POLICY — this workflow must never commit or
# push files back to the repository.
#
# Allowed:  verify, build, run release-please (it updates its own
#           release PR branch and creates tags/releases via the
#           API), publish images to ghcr.io, upload Actions
#           artifacts and release assets.
# Forbidden: git commit, git push, auto-committing SBOMs,
#            lockfile updates, or any other direct write to main.
#
# Version bumps reach main only through the release-please PR,
# which is reviewed and merged like any other PR.
#
# If a generated artifact (SBOM, snapshot, etc.) is stale,
# this workflow MUST FAIL — not auto-fix. The fix must be
# implemented on dev or a hotfix/* branch and merged via PR.
#
# The no-write-guard job in ci-main-pr.yml enforces this at PR time.
# ============================================================
#
# Release pipeline (release-please, see release-please-config.json):
#
#   1. A dev → main (or hotfix/* → main) merge lands here. release-please
#      opens or updates the release PR on main ("chore(main): release X.Y.Z").
#      It bumps VERSION + frontend/package.json and adds a CHANGELOG.md entry
#      built from the conventional commits since the last release.
#   2. Merging that release PR lands here again. release-please creates
#      the vX.Y.Z tag and GitHub Release, then the jobs below build that tag
#      and publish :X.Y.Z + :latest images and attach SBOMs to the release.
#   3. sync-main-to-dev.yml opens the main → dev PR that carries the
#      release commit (VERSION, CHANGELOG) back to dev.
#
# Pushes that don't create a release (step 1) publish nothing.
#
# Required secrets:
#   WEFTMARK_BOT_CLIENT_ID        — GitHub App client ID
#   WEFTMARK_BOT_PRIVATE_KEY      — GitHub App private key
#   (The bot token is used for release-please so its PR triggers CI;
#   PRs opened with GITHUB_TOKEN don't run workflows.)

on:
  push:
    branches: [main]

concurrency:
  group: main-push-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:

  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.WEFTMARK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.WEFTMARK_BOT_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sbom-backend:
    name: SBOM backend (CycloneDX + pip-licenses)
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # attach to the GitHub Release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate backend SBOM and license manifest
        run: |
          pip install cyclonedx-bom pip-licenses
          pip install -r backend/requirements.txt
          mkdir -p sbom
          cyclonedx-py requirements backend/requirements.txt \
            --output-format JSON --output-file sbom/sbom-backend.json
          pip-licenses --format=json --output-file sbom/licenses-backend.json

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" sbom/sbom-backend.json sbom/licenses-backend.json \
            --clobber --repo "$GITHUB_REPOSITORY"

  sbom-frontend:
    name: SBOM frontend (CycloneDX + license-checker)
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # attach to the GitHub Release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Generate frontend SBOM and license manifest
        run: |
          cd frontend && npm ci
          mkdir -p ../sbom
          npx @cyclonedx/cyclonedx-npm \
            --output-format JSON --output-file ../sbom/sbom-frontend.json
          npx license-checker --json --out ../sbom/licenses-frontend.json

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" sbom/sbom-frontend.json sbom/licenses-frontend.json \
            --clobber --repo "$GITHUB_REPOSITORY"

  docker-publish-backend:
    name: Publish — backend (main)
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Check VERSION file matches the release
        run: test "$(cat VERSION)" = "$VERSION"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -f backend/Dockerfile \
            -t "ghcr.io/weftmark/weftmark-backend:${VERSION}" \
            -t ghcr.io/weftmark/weftmark-backend:latest \
            .
          docker push "ghcr.io/weftmark/weftmark-backend:${VERSION}"
          docker push ghcr.io/weftmark/weftmark-backend:latest

  docker-publish-frontend:
    name: Publish — frontend (main)
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Check VERSION file matches the release
        run: test "$(cat VERSION)" = "$VERSION"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg VITE_APP_ENV="production" \
            --build-arg CODECOV_TOKEN=${{ secrets.CODECOV_TOKEN }} \
            -t "ghcr.io/weftmark/weftmark-frontend:${VERSION}" \
            -t ghcr.io/weftmark/weftmark-frontend:latest \
            ./frontend
          docker push "ghcr.io/weftmark/weftmark-frontend:${VERSION}"
          docker push ghcr.io/weftmark/weftmark-frontend:latest

  docker-publish-errors:
    name: Publish — error pages (main)
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push errors image
        run: |
          docker build -f errors/Dockerfile \
            -t ghcr.io/weftmark/weftmark-errors:latest \
            .
          docker push ghcr.io/weftmark/weftmark-errors:latest
