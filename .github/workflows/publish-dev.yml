name: Publish Dev Images

# Manual trigger only — publishes :{version}-dev.{sha} and :dev tags to ghcr.io,
# then opens a QA issue consolidating the test plans from all PRs merged
# since the previous dev publish.
#
# VERSION on dev only changes when a release-please release is synced back
# from main, so the short commit SHA is what makes each dev image tag unique.
# The QA issue title carries that tag; build_qa_issue.py reads the previous
# QA issue's SHA to find the range of PRs since the last publish.
#
# Required secrets:
#   CLERK_PUBLISHABLE_KEY_DEV secret is no longer required — key is injected at runtime

on:
  workflow_dispatch:

permissions: {}

jobs:

  resolve:
    name: Resolve dev commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      # Resolved once so both images and the QA issue describe the same commit,
      # even if dev moves while the build jobs run.
      - name: Read version and commit
        id: meta
        run: |
          VERSION=$(cat VERSION)
          SHA=$(git rev-parse HEAD)
          TAG="${VERSION}-dev.${SHA:0:7}"
          {
            echo "sha=${SHA}"
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG}"

  publish-backend:
    name: Publish — backend (dev)
    runs-on: ubuntu-latest
    needs: [resolve]
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -f backend/Dockerfile \
            -t "ghcr.io/weftmark/weftmark-backend:${TAG}" \
            -t ghcr.io/weftmark/weftmark-backend:dev \
            .
          docker push "ghcr.io/weftmark/weftmark-backend:${TAG}"
          docker push ghcr.io/weftmark/weftmark-backend:dev

  publish-frontend:
    name: Publish — frontend (dev)
    runs-on: ubuntu-latest
    needs: [resolve]
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg VITE_APP_ENV="dev" \
            --build-arg CODECOV_TOKEN=${{ secrets.CODECOV_TOKEN }} \
            -t "ghcr.io/weftmark/weftmark-frontend:${TAG}" \
            -t ghcr.io/weftmark/weftmark-frontend:dev \
            ./frontend
          docker push "ghcr.io/weftmark/weftmark-frontend:${TAG}"
          docker push ghcr.io/weftmark/weftmark-frontend:dev

  open-qa-issue:
    name: Open QA issue
    runs-on: ubuntu-latest
    needs: [resolve, publish-backend, publish-frontend]
    permissions:
      issues: write
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Build QA issue body
        id: qa-body
        env:
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/build_qa_issue.py

      - name: Create QA issue
        env:
          TITLE_SUFFIX: ${{ steps.qa-body.outputs.title_suffix }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "QA: v${IMAGE_TAG}${TITLE_SUFFIX}" \
            --body-file qa_issue_body.md \
            --label "qa"
